<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenLayer Spinner</title>
    <meta
      name="description"
      content="Portal-ready GenLayer loading spinner with neon edge sweep and soft diamond blink."
    />
    <link rel="icon" href="./mark.svg" type="image/svg+xml" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="stylesheet" href="./spinner.css?v=33" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "Switzer", system-ui, sans-serif;
        color: #1a1a1a;
        background:
          radial-gradient(ellipse 70% 40% at 50% 0%, #ffe4d4 0%, transparent 55%),
          #fff8f3;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 36px 20px 64px;
      }

      .intro {
        margin-bottom: 22px;
      }

      .kicker {
        margin: 0 0 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #ff6a33;
      }

      h1 {
        margin: 0 0 6px;
        font-size: clamp(24px, 4vw, 32px);
        letter-spacing: -0.04em;
        line-height: 1.15;
      }

      .lede {
        margin: 0;
        color: #6b6560;
        line-height: 1.45;
        font-size: 14px;
      }

      .panel {
        background: #fff;
        border: 1px solid #ead9cc;
        border-radius: 18px;
        overflow: hidden;
      }

      .preview {
        display: grid;
        place-items: center;
        padding: 40px 24px 28px;
        text-align: center;
        background:
          radial-gradient(circle at 50% 40%, #fff4ec 0%, transparent 60%);
      }

      .preview p {
        margin: 12px 0 0;
        font-size: 13px;
        color: #6b6560;
      }

      .setup {
        border-top: 1px solid #ead9cc;
        padding: 18px 20px 20px;
      }

      .setup-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
      }

      .setup-head h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 700;
      }

      .setup-actions {
        display: flex;
        gap: 8px;
      }

      .controls {
        display: grid;
        gap: 12px;
      }

      .control {
        display: grid;
        grid-template-columns: 110px 1fr 52px;
        align-items: center;
        gap: 10px;
      }

      .control-label {
        font-size: 12px;
        color: #6b6560;
      }

      .control strong {
        text-align: right;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .control input[type="range"] {
        width: 100%;
        margin: 0;
        accent-color: #ff6a33;
      }

      .swatches {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }

      .swatch {
        width: 20px;
        height: 20px;
        border-radius: 999px;
        border: 2px solid #fff;
        box-shadow: 0 0 0 1px #ead9cc;
        padding: 0;
        cursor: pointer;
        background: var(--swatch);
      }

      .swatch.is-on {
        box-shadow: 0 0 0 2px #1a1a1a;
      }

      .color-pick {
        width: 26px;
        height: 26px;
        padding: 0;
        border: 1px solid #ead9cc;
        border-radius: 7px;
        background: #fff;
        cursor: pointer;
      }

      .color-pick::-webkit-color-swatch-wrapper {
        padding: 2px;
      }

      .color-pick::-webkit-color-swatch {
        border: 0;
        border-radius: 4px;
      }

      .examples {
        margin-top: 14px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 1px;
        background: #ead9cc;
        border: 1px solid #ead9cc;
        border-radius: 18px;
        overflow: hidden;
      }

      @media (min-width: 640px) {
        .examples {
          grid-template-columns: 1fr 1fr;
        }

        .examples .example.sizes-panel {
          grid-column: 1 / -1;
        }
      }

      .example {
        background: #fff;
        padding: 16px 18px;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .example h2 {
        margin: 0 0 14px;
        font-size: 12px;
        font-weight: 700;
        color: #6b6560;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .example-body {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .example-body.sizes {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        align-items: end;
        justify-items: center;
        gap: 12px 8px;
        width: 100%;
      }

      .size {
        display: grid;
        gap: 8px;
        justify-items: center;
        align-content: end;
        font-size: 11px;
        color: #6b6560;
        width: 100%;
      }

      .example.dark {
        background: #1a1a1a;
      }

      .example.dark h2 {
        color: #9a9a9a;
      }

      .skeleton {
        flex: 1;
        display: grid;
        gap: 8px;
        min-width: 80px;
      }

      .bar {
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(90deg, #ffe8d6, #fff, #ffe8d6);
        background-size: 200% 100%;
        animation: shimmer 1.4s linear infinite;
      }

      @keyframes shimmer {
        to {
          background-position: -200% 0;
        }
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        height: 30px;
        padding: 0 12px;
        background: #ff6a33;
        color: #fff;
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      button.ghost {
        background: #fff;
        color: #1a1a1a;
        border: 1px solid #ead9cc;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: color-mix(in srgb, #fff4ec 90%, white);
        display: none;
        place-items: center;
        z-index: 20;
      }

      .overlay.is-on {
        display: grid;
      }

      .overlay p {
        margin: 12px 0 0;
        font-size: 13px;
        color: #6b6560;
        text-align: center;
      }

      footer {
        margin-top: 18px;
        font-size: 12px;
        color: #6b6560;
        line-height: 1.5;
      }

      a {
        color: #ff6a33;
      }

      @media (max-width: 520px) {
        .control {
          grid-template-columns: 1fr 52px;
        }

        .control-label {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <div class="overlay is-on" id="overlay">
      <div>
        <span data-gl-spinner data-size="xl" aria-label="Loading Portal"></span>
        <p>Loading Portal…</p>
      </div>
    </div>

    <main>
      <header class="intro">
        <p class="kicker">GenLayer Portal · Spinner</p>
        <h1>Neon edge sweep</h1>
        <p class="lede">
          Official Portal mark. Soft glow on both wings, gentle diamond blink.
        </p>
      </header>

      <section class="panel">
        <div class="preview">
          <span data-gl-spinner data-size="xl" aria-label="Spinner preview"></span>
          <p>Reaching consensus…</p>
        </div>

        <div class="setup">
          <div class="setup-head">
            <h2>Setup</h2>
            <div class="setup-actions">
              <button type="button" class="ghost" id="reset-speed">Reset</button>
              <button type="button" id="replay">
                <span data-gl-spinner data-size="sm" aria-hidden="true"></span>
                Replay
              </button>
            </div>
          </div>

          <div class="controls">
            <label class="control">
              <span class="control-label">Edge sweep</span>
              <input id="sweep-speed" type="range" min="1" max="15" step="0.1" value="4.2" />
              <strong><span id="sweep-val">4.2</span>s</strong>
            </label>
            <label class="control">
              <span class="control-label">Diamond blink</span>
              <input id="diamond-speed" type="range" min="0.4" max="6" step="0.05" value="1.55" />
              <strong><span id="diamond-val">1.55</span>s</strong>
            </label>
            <div class="control">
              <span class="control-label">Accent</span>
              <div class="swatches">
                <button type="button" class="swatch is-on" data-accent="#ff6a33" style="--swatch:#ff6a33" aria-label="Portal orange"></button>
                <button type="button" class="swatch" data-accent="#ff8b61" style="--swatch:#ff8b61" aria-label="Soft orange"></button>
                <button type="button" class="swatch" data-accent="#2f6bff" style="--swatch:#2f6bff" aria-label="Blue"></button>
                <button type="button" class="swatch" data-accent="#12b76a" style="--swatch:#12b76a" aria-label="Green"></button>
                <button type="button" class="swatch" data-accent="#7a5af8" style="--swatch:#7a5af8" aria-label="Violet"></button>
                <button type="button" class="swatch" data-accent="#f04438" style="--swatch:#f04438" aria-label="Red"></button>
                <input id="accent-color" class="color-pick" type="color" value="#ff6a33" aria-label="Custom accent" />
              </div>
              <strong id="accent-val">#ff6a33</strong>
            </div>
          </div>
        </div>
      </section>

      <section class="examples">
        <div class="example sizes-panel">
          <h2>Sizes</h2>
          <div class="example-body sizes">
            <div class="size"><span data-gl-spinner data-size="sm"></span>24</div>
            <div class="size"><span data-gl-spinner data-size="md"></span>48</div>
            <div class="size"><span data-gl-spinner data-size="lg"></span>72</div>
            <div class="size"><span data-gl-spinner data-size="xl"></span>128</div>
          </div>
        </div>
        <div class="example">
          <h2>Loading</h2>
          <div class="example-body">
            <span data-gl-spinner data-size="md"></span>
            <div class="skeleton">
              <div class="bar"></div>
              <div class="bar" style="width: 72%"></div>
              <div class="bar" style="width: 48%"></div>
            </div>
          </div>
        </div>
        <div class="example dark">
          <h2>On dark</h2>
          <div class="example-body">
            <span data-gl-spinner data-size="lg" data-tone="on-dark"></span>
            <span data-gl-spinner data-size="md" data-tone="on-dark"></span>
          </div>
        </div>
      </section>

      <footer>
        Mark from
        <a href="https://portal.genlayer.foundation/assets/genlayer-portal-logo.svg"
          >genlayer-portal-logo.svg</a
        >
        · <a href="./spinner.css">spinner.css</a>
        · <a href="./spinner.js">spinner.js</a>
      </footer>
    </main>

    <script type="module" src="./spinner.js?v=33"></script>
    <script type="module">
      const overlay = document.getElementById("overlay");
      const sweepInput = document.getElementById("sweep-speed");
      const diamondInput = document.getElementById("diamond-speed");
      const accentInput = document.getElementById("accent-color");
      const sweepVal = document.getElementById("sweep-val");
      const diamondVal = document.getElementById("diamond-val");
      const accentVal = document.getElementById("accent-val");
      const swatches = [...document.querySelectorAll(".swatch[data-accent]")];
      const DEFAULTS = { sweepSec: 4.2, diamondSec: 1.55, accent: "#ff6a33" };

      const fmt = (n) =>
        Number.isInteger(n)
          ? String(n)
          : n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");

      function syncSwatches(hex) {
        swatches.forEach((btn) => {
          btn.classList.toggle(
            "is-on",
            btn.getAttribute("data-accent").toLowerCase() === hex.toLowerCase()
          );
        });
      }

      function applySpeed() {
        const sweepSec = Number(sweepInput.value);
        const diamondSec = Number(diamondInput.value);
        sweepVal.textContent = fmt(sweepSec);
        diamondVal.textContent = fmt(diamondSec);
        if (typeof window.setSpinnerTiming === "function") {
          window.setSpinnerTiming({ sweepSec, diamondSec });
        }
      }

      function applyAccent(hex) {
        const next =
          typeof window.setSpinnerAccent === "function"
            ? window.setSpinnerAccent(hex)
            : hex;
        accentInput.value = next;
        accentVal.textContent = next;
        syncSwatches(next);
      }

      sweepInput.addEventListener("input", applySpeed);
      diamondInput.addEventListener("input", applySpeed);
      accentInput.addEventListener("input", () => applyAccent(accentInput.value));
      swatches.forEach((btn) => {
        btn.addEventListener("click", () =>
          applyAccent(btn.getAttribute("data-accent"))
        );
      });
      document.getElementById("reset-speed").addEventListener("click", () => {
        sweepInput.value = String(DEFAULTS.sweepSec);
        diamondInput.value = String(DEFAULTS.diamondSec);
        applySpeed();
        applyAccent(DEFAULTS.accent);
      });
      applySpeed();
      applyAccent(DEFAULTS.accent);

      const hide = () => overlay.classList.remove("is-on");
      window.setTimeout(hide, 2400);
      document.getElementById("replay").addEventListener("click", () => {
        if (typeof window.remountAllSpinners === "function") {
          window.remountAllSpinners();
        }
        overlay.classList.add("is-on");
        window.setTimeout(hide, 2400);
      });
    </script>
  </body>
</html>
